<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Detail | IndTaxPay Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="icon" type="image/png" href="../assets/logo.png">
</head>
<body>
  <!-- Loading -->
  <div class="ticket-loading" id="ticketLoading">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <!-- Ticket Page -->
  <div class="ticket-page" id="ticketPage" style="display:none;">
    <div class="ticket-content" id="ticketContent" style="padding-top: 40px;"></div>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script src="../backend/firebase-init.js"></script>
  <script src="../backend/firestore-helpers.js"></script>

  <script>
  (function() {
    var ticketLoading = document.getElementById('ticketLoading');
    var ticketPage = document.getElementById('ticketPage');
    var ticketContent = document.getElementById('ticketContent');
    var currentUserEmail = '';

    var params = new URLSearchParams(window.location.search);
    var ticketId = params.get('id');

    /* ── Auth Guard ── */
    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      try {
        var email = user.email ? user.email.toLowerCase().trim() : '';
        if (!email) {
          await auth.signOut();
          window.location.href = 'login.html?reason=unauthorized';
          return;
        }

        // Bypass Firestore read check for the super-admin to guarantee access
        if (email !== 'indtaxpay@gmail.com') {
          var doc = await db.collection('allowed_admins').doc(email).get();
          if (!doc.exists) {
            await auth.signOut();
            window.location.href = 'login.html?reason=unauthorized';
            return;
          }
        }

        var emailEl = document.getElementById('userEmail');
        if (emailEl) {
          emailEl.textContent = email;
        }
        currentUserEmail = email;
        loadTicket();
      } catch (err) {
        console.error('Ticket Auth Verification failed:', err);
        sessionStorage.setItem('adminAuthError', err.message || String(err));
        await auth.signOut();
        window.location.href = 'login.html?reason=auth-check-failed';
      }
    });

    /* ── Load Ticket Data ── */
    async function loadTicket() {
      if (!ticketId) {
        showNotFound();
        return;
      }

      try {
        var ticket = await getTicket(ticketId);
        var docs = await getTicketDocuments(ticketId);

        ticketLoading.style.display = 'none';
        ticketPage.style.display = '';

        if (!ticket) {
          showNotFound();
          return;
        }

        renderTicket(ticket, docs);
      } catch (err) {
        console.error(err);
        ticketLoading.style.display = 'none';
        ticketPage.style.display = '';
        showNotFound();
      }
    }

    function showNotFound() {
      ticketLoading.style.display = 'none';
      ticketPage.style.display = '';
      ticketContent.innerHTML = '<div style="padding:48px; text-align:center;"><h2 style="color:#E53E3E;">Ticket Not Found</h2><a href="dashboard.html" style="color:#F78A0E; margin-top:16px; display:inline-block;">← Back to Board</a></div>';
    }

    async function saveBlobWithPicker(blob, defaultName) {
      try {
        if (window.showSaveFilePicker) {
          const options = {
            suggestedName: defaultName,
            types: [{
              description: 'ZIP Archive',
              accept: {
                'application/zip': ['.zip'],
              },
            }],
          };
          const handle = await window.showSaveFilePicker(options);
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          console.log('User cancelled save picker');
          return false;
        }
        console.error('File System Access API failed:', err);
      }

      // Fallback to standard download anchor
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = defaultName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      return true;
    }

    function renderTicket(ticket, docs) {
      var badgeColor, badgeBg;
      if (ticket.status === 'Completed') {
        badgeBg = 'rgba(75, 156, 58, 0.14)';
        badgeColor = '#2E6B24';
      } else if (ticket.status === 'Rejected') {
        badgeBg = 'rgba(229, 62, 62, 0.10)';
        badgeColor = '#E53E3E';
      } else {
        badgeBg = 'rgba(247, 138, 14, 0.12)';
        badgeColor = '#F78A0E';
      }

      var progressBg = ticket.status === 'Rejected'
        ? 'linear-gradient(90deg, #E53E3E, #F78A0E)'
        : 'linear-gradient(90deg, #4B9C3A, #F78A0E, #4B9C3A)';

      var statusLabelsHtml = '';
      STATUSES.forEach(function(s) {
        if (s === 'Rejected') return;
        var cls = s === ticket.status ? ' active-label' : '';
        statusLabelsHtml += '<span class="' + cls + '">' + s + '</span>';
      });

      // Status options
      var statusOptions = '';
      STATUSES.forEach(function(s) {
        var sel = s === ticket.status ? ' selected' : '';
        statusOptions += '<option value="' + s + '"' + sel + '>' + s + '</option>';
      });

      // Documents HTML inside a single unified list container
      var docsHtml = '';
      if (docs.length === 0) {
        docsHtml = '<p class="doc-empty" style="padding:20px; text-align:center; color:var(--text-secondary); margin:0;">No documents uploaded yet.</p>';
      } else {
        docs.forEach(function(d, idx) {
          var borderStyle = idx === docs.length - 1 ? '' : ' border-bottom: 1px solid var(--border);';
          docsHtml += '<div style="display:flex; align-items:center; padding:16px;' + borderStyle + '">';
          docsHtml += '<span class="doc-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-saffron);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>';
          docsHtml += '<div style="margin-left:12px;"><p class="doc-name" style="margin:0; font-weight:600; font-size:0.9rem;">' + d.fileName + '</p>';
          docsHtml += '<p class="doc-meta" style="margin:2px 0 0 0; font-size:0.75rem; color:var(--text-secondary);">' + (d.type || 'Other') + ' • ' + formatFileSize(d.size) + ' • ' + formatFirestoreDate(d.uploadedAt) + '</p></div>';
          docsHtml += '</div>';
        });
      }

      ticketContent.innerHTML = ''
        // Premium Back Button
        + '<div style="margin-bottom: 24px; display: flex; align-items: center;">'
        + '<a href="dashboard.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-secondary); background: var(--panel-2); padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size:0.85rem; border: 1px solid var(--border); transition: var(--transition-base);">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'
        + 'Back to Board'
        + '</a>'
        + '</div>'

        // Unified Single Card layout containing Client Info + Documents side-by-side
        + '<div class="ticket-section" style="max-width: 1100px; margin: 0 auto; padding: 32px;">'
        + '<div class="two-col" style="margin-top:0;">'

        // Left Column (Client Information)
        + '<div>'
        + '<h3 style="margin-top:0; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">Client Information</h3>'
        + '<div class="info-row"><p class="info-label">Client ID</p><p class="info-value" style="font-weight:700;">' + ticket.ticketNumber + '</p></div>'
        + '<div class="info-row"><p class="info-label">Service Type</p><p class="info-value" style="font-weight:600;">' + ticket.serviceType + '</p></div>'
        + '<div class="info-row"><p class="info-label">Status</p><p class="info-value"><span class="badge" style="background:' + badgeBg + '; color:' + badgeColor + '; font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:6px; display:inline-block;">' + ticket.status + '</span></p></div>'
        + '<div class="info-row"><p class="info-label">Name</p><p class="info-value">' + ticket.name + '</p></div>'
        + '<div class="info-row"><p class="info-label">Phone</p><p class="info-value">' + ticket.phone + '</p></div>'
        + '<div class="info-row"><p class="info-label">Email</p><p class="info-value">' + ticket.email + '</p></div>'
        + '<div class="info-row"><p class="info-label">Created</p><p class="info-value">' + formatFirestoreDate(ticket.createdAt) + '</p></div>'
        + '<div class="info-row"><p class="info-label">Last Updated</p><p class="info-value">' + formatFirestoreDate(ticket.lastUpdated) + '</p></div>'
        + '</div>'

        // Right Column (Files & Documents)
        + '<div>'
        + '<h3 style="margin-top:0; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">Files &amp; Documents</h3>'
        + '<div class="docs-list-container" style="background:var(--panel-2); border:1px solid var(--border); border-radius:12px; overflow:hidden;">'
        + docsHtml
        + '</div>'
        + '</div>'

        + '</div>' // End of two-col
        + '</div>'; // End of unified layout
    }
  })();
  </script>
</body>
</html>
